experiment:
  name: normalizer_sanity
  output_root: runs
  seed: 42

checkpoint:
  path: null  # Set to the current synthetic-only Wasserstein checkpoint.
  strict: true

normalizer:
  enabled: true
  type: residual
  input_channels: 3
  hidden_channels: 16
  num_layers: 3
  kernel_size: 3
  activation: relu
  normalization: none
  residual_scale: 0.05
  initialize_identity: true
  clamp_output: false

training:
  max_epochs: 0
  train_normalizer: false
  freeze_landmarker: true
  finetune_last_backbone_stage: false
  train_heads: false
  landmark_loss: wasserstein

evaluation:
  datasets:
    synbaby: false
    babyland: true
    infanface: true
  save_visual_examples: true
  num_visual_examples: 32

reporting:
  save_markdown_report: true
  save_csv: true
  save_json: true
  save_plots: true
