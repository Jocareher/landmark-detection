# Run: python -m scripts.main --config configs/normalizer_experiments.yaml
# Keep the flat arguments mapping: keys are argparse destinations; CLI overrides YAML.
arguments:

  # ---------------------------------------------------------------------------
  # Experiment selection
  # ---------------------------------------------------------------------------
  # Active preset: LayerNorm training.
  # Baseline: normalizer_normalization: none, head_normalization: batch,
  # wandb_run_name: train_baseline_pca_image. Backbone keeps BatchNorm in all variants.
  # HPC: select --normalization baseline; the launcher overrides these fields.
  # InstanceNorm: set both normalization fields to instance.
  # AdaIN: set both fields to adain. Training updates source moments only on
  # synbaby72/train; the best checkpoint is recalibrated without augmentations.
  # For every variant, give wandb_run_name a distinct value.
  # Modes: none | normalizer_sanity | normalizer_train_frozen_landmarker |
  #        normalizer_joint_finetune.
  experiment_mode: normalizer_joint_finetune
  normalizer_normalization: layer
  head_normalization: layer
  wandb_run_name: train_layer_pca_image

  # ---------------------------------------------------------------------------
  # Training data and output
  # ---------------------------------------------------------------------------
  # output_dir is the parent directory; the run is saved under output_dir/wandb_run_name.
  dataset_root: /home/jocareher/Downloads/landmark-detection/data/synbaby72
  output_dir: /home/jocareher/Downloads/landmark-detection/runs
  cache_dir: /home/jocareher/Downloads/landmark-detection/dataset_cache

  # ---------------------------------------------------------------------------
  # Initialization and trainable modules
  # ---------------------------------------------------------------------------
  # Joint fine-tuning starts from official HRNet weights and new heads/normalizer.
  # Keep checkpoint null for this mode. Sanity/frozen-landmarker modes require a checkpoint.
  # Train the complete normalizer, transition3, stage4, and all task heads.
  # Earlier backbone stages and their BN statistics remain frozen.
  # Backbone normalization remains BatchNorm regardless of the head variant.
  pretrained_weights: /home/jocareher/Downloads/landmark-detection/weights/HR18-300W.pth
  checkpoint: null
  checkpoint_strict: true
  transfer_mode: fine_tuning
  num_unfrozen_stages: 1
  unfreeze_stem: false

  # ---------------------------------------------------------------------------
  # Residual normalizer architecture
  # ---------------------------------------------------------------------------
  # Hidden blocks: Conv -> selected normalization -> activation.
  # layer: LayerNorm across channels at each pixel.
  # instance: InstanceNorm2d with affine parameters and no running statistics.
  # adain: per-instance normalization toward fixed synbaby72 source moments;
  # the scale/bias and moments are saved with the trained checkpoint.
  # Other normalizer choices: none, group. Other head choice: batch.
  # The final zero-initialized convolution preserves the initial identity mapping.
  normalizer_hidden_channels: 16
  normalizer_num_layers: 3
  normalizer_kernel_size: 3
  normalizer_activation: relu
  normalizer_residual_scale: 0.05
  normalizer_initialize_identity: true
  normalizer_clamp_output: false

  # ---------------------------------------------------------------------------
  # Supervised losses and PCA
  # ---------------------------------------------------------------------------
  # Wasserstein uses barycenter decoding. Adaptive Wing settings are inactive here.
  # PCA uses ONE reconstruction MSE in input-crop pixel coordinates, after inverse
  # alignment, with full gradients through scale/rotation/translation. No size normalization.
  # The PCA weight below is retained from the previous setup; it is not recalibrated
  # for pixel-squared units. Set lambda_pca_projection to 0 to disable training PCA.
  landmark_loss: wasserstein
  wasserstein_softmax_temperature: 1.0
  wasserstein_epsilon: 1.0e-08
  adaptive_wing_omega: 14.0
  adaptive_wing_theta: 0.5
  adaptive_wing_epsilon: 1.0
  adaptive_wing_alpha: 2.1
  pca_prior_path: /home/jocareher/Downloads/landmark-detection/weights/pca_prior_13y_k32.pt
  lambda_pca_projection: 1.0

  # ---------------------------------------------------------------------------
  # Optional image regularization
  # ---------------------------------------------------------------------------
  # Disabled: no L1/TV image regularization is added.
  normalizer_image_regularization: false
  normalizer_lambda_l1: 0.0
  normalizer_lambda_tv: 0.0

  # ---------------------------------------------------------------------------
  # Training budget and runtime
  # ---------------------------------------------------------------------------
  epochs: 60
  batch_size: 32
  eval_batch_size: 32
  num_workers: 4
  lr: 0.0001
  seed: 42
  device: auto
  disable_amp: false
  disable_cache: false
  smoke_test: false

  # ---------------------------------------------------------------------------
  # Photometric augmentation
  # ---------------------------------------------------------------------------
  enable_photometric_augmentations: true
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  saturation_jitter: 0.1
  color_jitter_probability: 0.5
  blur_probability: 0.5
  blur_radius_min: 0.1
  blur_radius_max: 1.2
  noise_probability: 0.5
  noise_std: 0.02
  jpeg_probability: 0.15
  jpeg_quality_min: 60
  jpeg_quality_max: 95
  rgb_shift_probability: 0.15
  rgb_shift_limit: 0.04

  # ---------------------------------------------------------------------------
  # Geometric augmentation
  # ---------------------------------------------------------------------------
  # Parameters below are inactive while enable_geometric_augmentations is false.
  enable_geometric_augmentations: false
  geometric_probability: 0.5
  geometric_max_translation: 0.05
  geometric_scale_min: 0.95
  geometric_scale_max: 1.05
  geometric_max_rotation_deg: 8.0

  # ---------------------------------------------------------------------------
  # Post-training evaluation datasets
  # ---------------------------------------------------------------------------
  # Natural datasets remain evaluation-only. These paths do not select training data.
  # Sanity mode disables SynBaby unless --evaluate-synbaby is explicitly supplied.
  evaluate_synbaby: true
  evaluate_babyland: true
  evaluate_infanface: true
  babyland_crop_root: /home/jocareher/Downloads/babyland72_622_inference/crops/all_detections
  babyland_gt_root: /home/jocareher/Downloads/landmark-detection/data/babyland72/labels
  babyland_source_root: null
  infanface_crop_root: /home/jocareher/Downloads/infanface_inference/crops/all_detections
  infanface_gt_root: /home/jocareher/Downloads/infanface_prepared/all/labels
  infanface_source_root: null

  # ---------------------------------------------------------------------------
  # Normalizer diagnostics
  # ---------------------------------------------------------------------------
  # These monitoring options do not enable TTA; use pca_tta_evaluation.yaml for TTA.
  normalizer_visual_examples: 32
  normalizer_monitoring: true
  normalizer_monitor_probes: 4
  normalizer_monitor_steps: [0, 1, 5, 10, 20]
  normalizer_tta_monitor_steps: [0, 1, 5, 10, 20]
  normalizer_monitor_difference_max: 0.15
  normalizer_monitor_registration_warning_px: 1.0
  normalizer_monitor_edge_correlation_warning: 0.9

  # ---------------------------------------------------------------------------
  # Tracking and reproducibility
  # ---------------------------------------------------------------------------
  use_wandb: true
  wandb_project: BabyLMKS
  save_config: true
